<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>とうものビンゴ</title>
    <style>
        :root {
            --bg-color: #071126; 
            --accent-color: #ffa502;
            --primary-color: #ff4757;
        }
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 案内テキスト */
        .instruction {
            width: 100%;
            max-width: 420px;
            font-size: 11px;
            font-weight: bold;
            background-color: rgba(7, 17, 38, 0.85);
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,165,2,0.4);
            line-height: 1.4;
            margin-bottom: 12px;
            color: #fff;
            z-index: 10;
        }

        /* 📱 左右のカット枠（スマホ画面幅に固定） */
        .bingo-outer {
            width: 100%;
            max-width: 420px; 
            overflow: hidden; 
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 中央のビンゴボードの横幅をスマホの画面幅いっぱいにジャストフィット */
        .bingo-container {
            position: relative;
            width: 142%; 
            left: -21%;  
        }

        /* 背景画像 */
        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* スマホ画面の端から端までめいっぱい広がったビンゴボード */
        .bingo-board {
            position: absolute;
            top: 25.4%;    
            left: 29.2%;   
            width: 41.6%;  
            height: 70.8%; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4.5% 3.5%; 
        }

        /* 9つの文章が入る白いマス */
        .cell {
            background-color: rgba(255, 255, 255, 0.98); 
            border: 1.5px solid #bdc3c7;
            border-radius: 6px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px; 
            cursor: pointer;
            position: relative;
            overflow: hidden; 
            aspect-ratio: 1 / 1; 
            width: 100%;
            height: 100%;
        }

        /* ルビ（ふりがな）の調整 */
        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 7.5px; 
            color: #555;
            font-weight: normal;
            letter-spacing: 0;
            padding-bottom: 1px;
        }
