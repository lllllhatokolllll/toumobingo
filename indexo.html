<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ときなん盆踊りフェス ビンゴ</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --accent-color: #ffa502;
            --bg-color: #071126;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .instruction {
            width: 100%;
            max-width: 400px;
            font-size: 12px;
            font-weight: bold;
            background-color: rgba(7, 17, 38, 0.85);
            padding: 8px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255,165,2,0.4);
            line-height: 1.4;
            margin-bottom: 15px;
            box-sizing: border-box;
            color: #fff;
        }

        .bingo-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            background-color: #112244; /* 画像が万が一出なくても枠がわかる保険 */
        }

        .bingo-board {
            position: absolute;
            top: 36.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 71.5%; 
            height: 56.5%; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            box-sizing: border-box;
            padding: 4px;
            z-index: 5;
        }

        .cell {
            background-color: rgba(255, 255, 255, 0.95); 
            border: 1.5px solid #bdc3c7;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }

        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 8px;
            color: #444;
            font-weight: normal;
            letter-spacing: 0;
            padding-bottom: 1px;
        }
        .cell-text {
            font-size: 11px;
            font-weight: bold;
            line-height: 1.35;
            color: #1a252f; 
            word-break: break-all;
            z-index: 1;
        }
        .cell.selected .cell-text {
            opacity: 0.2;
        }

        /* 🔴 確実に動くシステム製「祭うちわ」スタンプ */
        .stamp-image {
            display: none;
            position: absolute;
            width: 75%;
            height: 75%;
            background-color: #d63031; 
            border-radius: 50% 50% 45% 45%; 
            color: #ffffff;
            font-family: 'Hiragino Mincho ProN', serif;
            font-size: 24px;
            font-weight: bold;
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
            align-items: center;
            justify-content: center;
        }
        .stamp-image::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 12px;
            background-color: #2d3436;
            border-radius: 2px;
        }
        .cell.selected .stamp-image {
            display: flex;
            animation: blow-stamp 0.12s ease-out forwards;
        }
        @keyframes blow-stamp {
            0% { transform: scale(2) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(-10deg); opacity: 0.95; }
        }

        /* 🎉 動画の代わりに確実に開くポップアップ演出 */
        .clear-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(7, 17, 38, 0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .clear-message {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(255,165,2,0.8);
            margin-bottom: 20px;
            animation: bounce 0.5s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .close-popup-btn {
            background-color: #ffffff;
            color: #071126;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 結果・引き換え画面 */
        .result-screen {
            display: none;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255,71,87,0.4);
            box-sizing: border-box;
        }
        .result-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .prize-info {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
        }
        .prize-info h3 {
            margin: 0 0 8px 0;
            color: var(--accent-color);
            border-bottom: 1px dashed rgba(255,255,255,0.4);
            padding-bottom: 4px;
            font-size: 15px;
        }
        .staff-button {
            margin-top: 15px;
            background-color: #ffffff;
            color: var(--primary-color);
            border: none;
            padding: 12px 2
